<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="css/login.css" />
  <title>Login - Helpdesk ULBI</title>
  <style>
    /* === CUSTOM ALERT MODAL STYLE === */
    .custom-alert-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10vh;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .custom-alert-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .custom-alert-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      transform: translateY(-20px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .custom-alert-overlay.show .custom-alert-box {
      transform: translateY(0) scale(1);
    }

    .alert-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .alert-icon svg {
      width: 24px;
      height: 24px;
    }

    .custom-alert-box h3 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .custom-alert-box p {
      margin: 0;
      font-size: 15px;
      color: #475569;
      line-height: 1.5;
    }

    /* Link bantuan pada modal */
    .alert-help-link {
      display: inline-block;
      margin-top: 16px;
      color: #ea580c;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .alert-help-link:hover {
      text-decoration: underline;
    }

    /* Help Center Admin */
    .alert-admin-link {
      display: inline-block;
      margin-top: 12px;
      color: #16a34a;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .alert-admin-link:hover {
      text-decoration: underline;
    }

    /* Tombol daftar pada modal */
    .alert-register-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #ea580c;
      color: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .alert-register-btn:hover {
      background: #c2410c;
    }

    .custom-alert-box.success .alert-icon {
      background-color: #dcfce7;
      color: #16a34a;
    }

    .custom-alert-box.error .alert-icon {
      background-color: #fee2e2;
      color: #dc2626;
    }
    
    /* =========================
      BUTTON BANTUAN
      ========================= */
    .btn-help {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 0 15px;

      border: 1px solid #cbd7e6;
      border-radius: 7px;

      background: #ffffff;
      color: var(--navy);

      font-family: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    .btn-help:hover {
      transform: translateY(-1px);
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(244, 81, 11, 0.12);
    }

    .btn-help:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn-help:focus-visible {
      outline: 3px solid rgba(244, 81, 11, 0.18);
      outline-offset: 2px;
    }

    .btn-help i {
      font-size: 17px;
      line-height: 1;
    }

    .alert-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;

      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: transparent;
      color: #64748b;

      font-size: 22px;
      font-weight: 500;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    .alert-close-btn:hover {
      background: #f1f5f9;
      color: #dc2626;
    }
  </style>
</head>

<body>
  <div class="login-page">
    <!-- Left Section: Branding and Background -->
    <div class="left-section">
      <div class="left-content">
        <div class="logo-container">
          <img src="imgs/logoULBI.png" alt="Logo ULBI" />
        </div>


        <h1>Selamat Datang<br>di <span>Helpdesk ULBI</span></h1>

        <p>
          Kami siap membantu Anda dengan dukungan teknis dan solusi cepat
          untuk segala kebutuhan akademik dan administratif di ULBI.
        </p>

        <div class="features">
          <div class="feature">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
            Respon Cepat
          </div>
          <div class="feature">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
            Aman & Terpercaya
          </div>
          <div class="feature">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            Dukungan 24/7
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="right-section">
      <div class="form-container">
        <div class="form-card">
          <h2>Login Akun</h2>
          <p class="subtitle">Masukkan Email dan Password Anda untuk melanjutkan.</p>
          <form id="loginForm">
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input type="text" id="email" placeholder="Contoh: 202310001@ulbi.ac.id" required />
              </div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z" />
                  <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
                </svg>
                <input type="password" id="password" placeholder="" required />
                <button type="button" class="eye-toggle" id="togglePassword">
                  <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <button type="button" class="btn-secondary" onclick="window.location.href='/register.html'">Daftar Akun
              Baru</button>
            <button type="button" class="btn-help" onclick="window.location.href='faq.html'">
                <i class="lni lni-question-circle"></i>
                Bantuan?
            </button>
            <button type="button" onclick="HandleBack()" style="width: 100%; padding: 12px; background: transparent; color: #64748b; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: color 0.2s; text-decoration: underline; text-decoration-color: transparent; display: flex; align-items: center; justify-content: center; gap: 6px;" onmouseover="this.style.color='#ea580c'; this.style.textDecorationColor='#ea580c'" onmouseout="this.style.color='#64748b'; this.style.textDecorationColor='transparent'">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"/>
              </svg>
              Kembali ke Homepage
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div class="custom-alert-overlay" id="customAlert">
    <div class="custom-alert-box" id="alertContent"></div>
  </div>
  <script>
    const existingToken = localStorage.getItem("token");
    const existingIduser = localStorage.getItem("iduser");

    if (existingToken && existingIduser) {
      window.location.href = "info.html";
    }

    function HandleBack() {
      window.location.replace("https://helpdesk.ulbi.ac.id/");
    }
    function showCustomAlert(message, type = "success") {
      const overlay = document.getElementById("customAlert");
      const content = document.getElementById("alertContent");

      const iconSvg = type === "success"
        ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

      content.className = "custom-alert-box " + type;

      content.innerHTML = `
        ${
          type === "error"
            ? `
              <button
                type="button"
                class="alert-close-btn"
                onclick="closeCustomAlert()"
                aria-label="Tutup"
              >
                ×
              </button>
            `
            : ""
        }

        <div class="alert-icon">${iconSvg}</div>

        <h3>
          ${type === "success" ? "Berhasil!" : "Gagal!"}
        </h3>

        <p>${message}</p>

        ${
          type === "error"
            ? `
              <a
                href="https://wa.me/6289657140789"
                target="_blank"
                rel="noopener noreferrer"
                class="alert-admin-link"
              >
                Hubungi Help Center Admin — Rifky Najra Adipura →
              </a>
            `
            : ""
        }
      `;

      overlay.classList.add("show");

      // Hanya modal SUCCESS yang otomatis tertutup
      if (type === "success") {
        setTimeout(() => {
          overlay.classList.remove("show");
        }, 3000);
      }

      // Tutup ketika klik area luar modal
      overlay.onclick = (e) => {
        if (e.target === overlay) {
          closeCustomAlert();
        }
      };
    }

    function closeCustomAlert() {
      const overlay = document.getElementById("customAlert");

      overlay.classList.remove("show");
    }

    function closeCustomAlert() {
      const overlay = document.getElementById("customAlert");

      overlay.classList.remove("show");
    }

    // Password toggle functionality
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);

      // Toggle icon visually
      if (type === "password") {
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    // Event listener form login
    document
      .getElementById("loginForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        // ==========================================
        // VALIDASI INPUT
        // ==========================================
        if (!email || !password) {
          showCustomAlert(
            "Email dan password harus diisi terlebih dahulu.",
            "error"
          );
          return;
        }

        try {
          // ==========================================
          // REQUEST LOGIN KE API
          // ==========================================
          const response = await fetch(
            "https://ruangsehat-be.ulbi.ac.id/api/public/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                email: email,
                password: password,
              }),
            }
          );

          // Ambil response dari backend
          const result = await response.json();

          console.log("Login response:", result);
          console.log("HTTP status:", response.status);

          // ==========================================
          // 1. LOGIN BERHASIL
          // ==========================================
          if (response.ok && result.data?.token) {
            console.log("Data result:", result);

            localStorage.setItem("token", result.data.token);
            localStorage.setItem("iduser", result.data.user_id);

            showCustomAlert(
              "Login berhasil! Mengarahkan ke dashboard...",
              "success"
            );

            setTimeout(() => {
              window.location.href = "./info.html";
            }, 1500);

            return;
          }

          // ==========================================
          // 2. AKUN BELUM TERDAFTAR
          // ==========================================
          if (result.code == 404 || response.status == 404) {
            showCustomAlert(
              `
                Email yang Anda masukkan belum terdaftar.
                <br>

                <span style="
                  display: block;
                  margin-top: 10px;
                  line-height: 1.5;
                ">
                  Silakan lakukan registrasi terlebih dahulu untuk membuat akun.
                </span>

                <a
                  href="/register.html"
                  class="alert-register-btn"
                >
                  Daftar Sekarang
                </a>
              `,
              "error"
            );

            return;
          }

          // ==========================================
          // 3. EMAIL / PASSWORD SALAH
          // ==========================================
          const errorMessage =
            result.status ||
            result.message ||
            "Email atau password yang Anda masukkan tidak sesuai.";

          showCustomAlert(
            `
              ${errorMessage}

              <br>

              <span style="
                display: block;
                margin-top: 12px;
                font-size: 13px;
                color: #64748b;
                line-height: 1.5;
              ">
                Silakan periksa kembali email dan password Anda.
                <br>
                Jika lupa password atau mengalami kendala akun SIAKAD/eDLINK,
                silakan cek panduan bantuan melalui FAQ.
              </span>

              <a
                href="faq.html"
                class="alert-help-link"
              >
                Lihat Panduan di FAQ →
              </a>
            `,
            "error"
          );

          return;

        } catch (error) {
          // ==========================================
          // 4. SERVER / KONEKSI / REQUEST ERROR
          // ==========================================
          console.error("Error:", error);

          showCustomAlert(
            `
              Gagal terhubung ke server.
              <br>

              <span style="
                display: block;
                margin-top: 10px;
                font-size: 13px;
                color: #64748b;
                line-height: 1.5;
              ">
                Periksa koneksi internet Anda dan coba lagi.
              </span>

              <a
                href="faq.html"
                class="alert-help-link"
              >
                Butuh bantuan? Lihat FAQ →
              </a>
            `,
            "error"
          );

          return;
        }
      });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="css/login.css" />
  <title>Login - Helpdesk ULBI</title>
  <style>
    /* === CUSTOM ALERT MODAL STYLE === */
    .custom-alert-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10vh;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .custom-alert-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .custom-alert-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      transform: translateY(-20px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .custom-alert-overlay.show .custom-alert-box {
      transform: translateY(0) scale(1);
    }

    .alert-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .alert-icon svg {
      width: 24px;
      height: 24px;
    }

    .custom-alert-box h3 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .custom-alert-box p {
      margin: 0;
      font-size: 15px;
      color: #475569;
      line-height: 1.5;
    }

    .custom-alert-box.success .alert-icon {
      background-color: #dcfce7;
      color: #16a34a;
    }

    .custom-alert-box.error .alert-icon {
      background-color: #fee2e2;
      color: #dc2626;
    }
  </style>
</head>

<body>
  <div class="login-page">
    <!-- Left Section: Branding and Background -->
    <div class="left-section">
      <div class="left-content">
        <div class="logo-container">
          <img src="imgs/logoULBI.png" alt="Logo ULBI" />
        </div>


        <h1>Selamat Datang<br>di <span>Helpdesk ULBI</span></h1>

        <p>
          Kami siap membantu Anda dengan dukungan teknis dan solusi cepat
          untuk segala kebutuhan akademik dan administratif di ULBI.
        </p>

        <div class="features">
          <div class="feature">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
            Respon Cepat
          </div>
          <div class="feature">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
            Aman & Terpercaya
          </div>
          <div class="feature">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            Dukungan 24/7
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="right-section">
      <div class="form-container">
        <div class="form-card">
          <h2>Login Akun</h2>
          <p class="subtitle">Masukkan Email dan Password Anda untuk melanjutkan.</p>
          <form id="loginForm">
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input type="text" id="email" placeholder="Contoh: 202310001@ulbi.ac.id" required />
              </div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z" />
                  <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
                </svg>
                <input type="password" id="password" placeholder="" required />
                <button type="button" class="eye-toggle" id="togglePassword">
                  <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <button type="button" class="btn-secondary" onclick="window.location.href='/register.html'">Daftar Akun
              Baru</button>
            <button type="button" onclick="HandleBack()" style="width: 100%; padding: 12px; background: transparent; color: #64748b; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: color 0.2s; text-decoration: underline; text-decoration-color: transparent; display: flex; align-items: center; justify-content: center; gap: 6px;" onmouseover="this.style.color='#ea580c'; this.style.textDecorationColor='#ea580c'" onmouseout="this.style.color='#64748b'; this.style.textDecorationColor='transparent'">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"/>
              </svg>
              Kembali ke Homepage
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div class="custom-alert-overlay" id="customAlert">
    <div class="custom-alert-box" id="alertContent"></div>
  </div>
  <script>
    function HandleBack() {
      window.location.replace("https://helpdesk.ulbi.ac.id/");
    }
    function showCustomAlert(message, type = "success", autoClose = true) {
      const overlay = document.getElementById("customAlert");
      const content = document.getElementById("alertContent");

      const iconSvg = type === "success"
        ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

      content.className = "custom-alert-box " + type;
      content.innerHTML = `
        <div class="alert-icon">${iconSvg}</div>
        <h3>${type === "success" ? "Berhasil!" : "Gagal!"}</h3>
        <p>${message}</p>
      `;

      overlay.classList.add("show");

      if (autoClose) {
        setTimeout(() => {
          overlay.classList.remove("show");
        }, 3000);
      }

      // Tutup saat klik di luar kotak
      overlay.onclick = (e) => {
        if (e.target === overlay) {
          overlay.classList.remove("show");
        }
      };
    }

    // Password toggle functionality
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);

      // Toggle icon visually
      if (type === "password") {
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    // Event listener form login
    document
      .getElementById("loginForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showCustomAlert("Email dan password harus diisi.", "error");
          return;
        }

        try {
          const response = await fetch(
            "https://ruangsehat-be.ulbi.ac.id/api/public/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                email,
                password,
              }),
            }
          );

          const result = await response.json();

          if (response.ok && result.data?.token) {
            console.log("data reuslt: ", result);
            localStorage.setItem("token", result.data.token);
            localStorage.setItem("iduser", result.data.user_id);
            showCustomAlert(
              "Login berhasil! Mengarahkan ke dashboard...",
              "success"
            );
            setTimeout(() => {
              window.location.href = "./info.html";
            }, 1500);
          } else if (result.code == 404) {
            showCustomAlert(
              "Akun kamu belum terdaftar, Silahkan lakukan register terlebih dahulu.",
              "error"
            );
            setTimeout(() => {
              window.location.replace("/register.html");
            }, 5000);
          } else {
            showCustomAlert(
              result.status || "Email atau password salah.",
              "error"
            );
          }
        } catch (error) {
          console.error("Error:", error);
          showCustomAlert(
            "Gagal terhubung ke server. Periksa koneksi Anda.",
            "error"
          );
        }
      });
  </script>
</body>

</html>

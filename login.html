<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="css/login.css" />
    <title>Login</title>
    <style>
      /* === CUSTOM ALERT MODAL STYLE === */

      .custom-alert-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20vh;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .custom-alert-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .custom-alert-box {
        background: white;
        padding: 24px 32px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 90%;
        transform: translateY(-20px);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .custom-alert-overlay.show .custom-alert-box {
        transform: translateY(0);
      }

      .custom-alert-box h3 {
        margin: 0 0 12px;
        font-size: 20px;
        color: #2d3748;
      }

      .custom-alert-box p {
        margin: 0;
        font-size: 16px;
        color: #4a5568;
        line-height: 1.5;
      }

      .custom-alert-box.success {
        border-left: 4px solid #48bb78;
      }

      .custom-alert-box.error {
        border-left: 4px solid #e53e3e;
      }
    </style>
  </head>

  <body>
    <div class="background-image"></div>
    <div class="form-container">
      <div class="form-header">
        <img src="imgs/logoULBI.png" alt="Logo" style="height: 60px" />
        <h1>Login</h1>
        <p>
          Apakah kamu belum mempunyai akun?
          <a href="/register.html">Daftar Akun</a>
        </p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          />
        </div>
        <button type="submit" class="submit-btn">Login</button>
        <br />
        <br />
        <button class="submit-btn" onclick="HandleBack()">
          Kembali ke Homepage
        </button>
        <div class="login-link">
          Apakah kamu belum mempunyai akun?
          <a href="/register.html">Daftar Akun</a>
        </div>
      </form>
    </div>

    <!-- Custom Alert Modal -->
    <div class="custom-alert-overlay" id="customAlert">
      <div class="custom-alert-box" id="alertContent"></div>
    </div>

    <script>
      function HandleBack() {
        window.location.replace("https://helpdesk.ulbi.ac.id/");
      }

      function showCustomAlert(message, type = "success", autoClose = true) {
        const overlay = document.getElementById("customAlert");
        const content = document.getElementById("alertContent");

        content.className = "custom-alert-box " + type;
        content.innerHTML = `<h3>${
          type === "success" ? "Berhasil!" : "Gagal!"
        }</h3><p>${message}</p>`;

        overlay.classList.add("show");

        if (autoClose) {
          setTimeout(() => {
            overlay.classList.remove("show");
          }, 3000);
        }

        // Tutup saat klik di luar kotak
        overlay.onclick = (e) => {
          if (e.target === overlay) {
            overlay.classList.remove("show");
          }
        };
      }

      // Event listener form login
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          if (!email || !password) {
            showCustomAlert("Email dan password harus diisi.", "error");
            return;
          }

          try {
            const response = await fetch(
              "https://ruangsehat-be.ulbi.ac.id/api/public/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  email,
                  password,
                }),
              }
            );

            const result = await response.json();

            if (response.ok && result.data?.token) {
              console.log("data reuslt: ", result);
              localStorage.setItem("token", result.data.token);
              localStorage.setItem("iduser", result.data.user_id);
              showCustomAlert(
                "Login berhasil! Mengarahkan ke dashboard...",
                "success"
              );
              setTimeout(() => {
                window.location.href = "./info.html";
              }, 1500);
            } else if (result.code == 404) {
              showCustomAlert(
                "Akun kamu belum terdaftar, Silahkan lakukan register terlebih dahulu.",
                "error"
              );
              setTimeout(() => {
                window.location.replace("/register.html");
              }, 5000);
            } else {
              showCustomAlert(
                result.status || "Email atau password salah.",
                "error"
              );
            }
          } catch (error) {
            console.error("Error:", error);
            showCustomAlert(
              "Gagal terhubung ke server. Periksa koneksi Anda.",
              "error"
            );
          }
        });
    </script>
  </body>
</html>
